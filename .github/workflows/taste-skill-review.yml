name: Taste Skill Review

on:
  push:
    paths:
      - '.github/workflows/taste-skill-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Checkout pinned Taste Skill
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: tasteskill/tasteskill
          ref: 37c8c376b92ebc02456f7c70776b514fddda88e1
          path: taste-skill-src
          persist-credentials: false

      - name: Checkout pinned SkillSpector
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: NVIDIA/SkillSpector
          ref: 7805bb94843d91cb9937f57264ca52642164499b
          path: skillspector-src
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Structural controlled test
        shell: bash
        run: |
          set -euo pipefail
          TARGET='taste-skill-src/skills/taste-skill'
          test -d "$TARGET"
          test -f "$TARGET/SKILL.md"

          if find "$TARGET" -type f ! \( -name '*.md' -o -name '*.yaml' -o -name '*.yml' \) | grep -q .; then
            echo 'Unexpected file types found in scoped skill:'
            find "$TARGET" -type f ! \( -name '*.md' -o -name '*.yaml' -o -name '*.yml' \)
            exit 1
          fi

          if find "$TARGET" -type f -perm /111 | grep -q .; then
            echo 'Unexpected executable files found:'
            find "$TARGET" -type f -perm /111
            exit 1
          fi

          grep -q '^name: design-taste-frontend' "$TARGET/SKILL.md"
          grep -q 'DEPENDENCY VERIFICATION' "$TARGET/SKILL.md"

      - name: Install SkillSpector
        run: python -m pip install ./skillspector-src

      - name: Run scoped SkillSpector scan
        shell: bash
        run: |
          set +e
          TARGET='./taste-skill-src/skills/taste-skill'
          skillspector scan "$TARGET" --no-llm --format json --output taste-skill-skillspector.json
          JSON_RC=$?
          skillspector scan "$TARGET" --no-llm --format markdown --output taste-skill-skillspector.md
          MD_RC=$?
          printf 'json_exit_code=%s\nmarkdown_exit_code=%s\n' "$JSON_RC" "$MD_RC" | tee taste-skill-skillspector-exit-codes.txt
          exit "$JSON_RC"

      - name: Record pinned commits
        if: always()
        run: |
          git -C taste-skill-src rev-parse HEAD > taste-skill-commit.txt
          git -C skillspector-src rev-parse HEAD > skillspector-commit.txt

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: taste-skill-review
          path: |
            taste-skill-skillspector.json
            taste-skill-skillspector.md
            taste-skill-skillspector-exit-codes.txt
            taste-skill-commit.txt
            skillspector-commit.txt
          retention-days: 14
