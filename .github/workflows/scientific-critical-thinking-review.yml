name: Scientific Critical Thinking Review

on:
  push:
    paths:
      - '.github/workflows/scientific-critical-thinking-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tooling
        uses: actions/checkout@v4

      - name: Checkout pinned K-Dense scientific-agent-skills
        uses: actions/checkout@v4
        with:
          repository: K-Dense-AI/scientific-agent-skills
          ref: 1e5eeffbdad3749125afe7ab48a39694e27f181c
          path: scientific-agent-skills

      - name: Checkout pinned SkillSpector
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/SkillSpector
          ref: 7805bb94843d91cb9937f57264ca52642164499b
          path: skillspector-src

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Structural controlled test
        run: |
          TARGET=scientific-agent-skills/skills/scientific-critical-thinking
          test -f "$TARGET/SKILL.md"
          test -d "$TARGET/references"
          if find "$TARGET" -type f ! -name '*.md' | grep -q .; then
            echo 'Unexpected non-Markdown files found:'
            find "$TARGET" -type f ! -name '*.md'
            exit 1
          fi
          if find "$TARGET" -type f -perm /111 | grep -q .; then
            echo 'Unexpected executable files found:'
            find "$TARGET" -type f -perm /111
            exit 1
          fi
          grep -q 'allowed-tools: Read Write Edit' "$TARGET/SKILL.md"
          grep -q 'Analytical guidance needs no network' "$TARGET/SKILL.md"
          grep -q 'Optional figures' "$TARGET/SKILL.md"

      - name: Install SkillSpector
        run: python -m pip install ./skillspector-src

      - name: Run scoped SkillSpector scan
        run: |
          TARGET=./scientific-agent-skills/skills/scientific-critical-thinking
          skillspector scan "$TARGET" --no-llm --format json --output scientific-critical-thinking-skillspector.json
          skillspector scan "$TARGET" --no-llm --format markdown --output scientific-critical-thinking-skillspector.md

      - name: Record pinned commits
        if: always()
        run: |
          git -C scientific-agent-skills rev-parse HEAD > k-dense-commit.txt
          git -C skillspector-src rev-parse HEAD > skillspector-commit.txt

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scientific-critical-thinking-review
          if-no-files-found: warn
          path: |
            scientific-critical-thinking-skillspector.json
            scientific-critical-thinking-skillspector.md
            k-dense-commit.txt
            skillspector-commit.txt
          retention-days: 14
