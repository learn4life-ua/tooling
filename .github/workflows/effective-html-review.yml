name: Effective HTML Review

on:
  push:
    paths:
      - '.github/workflows/effective-html-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Checkout pinned Effective HTML
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: plannotator/effective-html
          ref: d95debbaef15af1d201fc6c10c77cf92b524a0d6
          path: effective-html
          persist-credentials: false

      - name: Checkout pinned SkillSpector
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: NVIDIA/SkillSpector
          ref: 7805bb94843d91cb9937f57264ca52642164499b
          path: skillspector-src
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Structural controlled test
        shell: bash
        run: |
          set -euo pipefail
          TARGET=effective-html/skills
          test -d "$TARGET"
          test -f "$TARGET/html/SKILL.md"
          test -f "$TARGET/design-artifact/SKILL.md"
          test -f "$TARGET/html-wireframe/SKILL.md"
          test -f "$TARGET/html-prototype/SKILL.md"
          test -f "$TARGET/html-plan/SKILL.md"
          test -f "$TARGET/html-diagram/SKILL.md"
          if find "$TARGET" -type f ! \( -name '*.md' -o -name '*.yaml' -o -name '*.yml' \) | grep -q .; then
            echo 'Unexpected file types found in skills scope:'
            find "$TARGET" -type f ! \( -name '*.md' -o -name '*.yaml' -o -name '*.yml' \)
            exit 1
          fi
          if find "$TARGET" -type f -perm /111 | grep -q .; then
            echo 'Unexpected executable files found:'
            find "$TARGET" -type f -perm /111
            exit 1
          fi
          grep -q 'self-contained' "$TARGET/html/SKILL.md"
          grep -q 'without a build step' "$TARGET/html/SKILL.md"

      - name: Install SkillSpector
        run: python -m pip install ./skillspector-src

      - name: Run scoped SkillSpector scan
        shell: bash
        run: |
          set +e
          TARGET=./effective-html/skills
          skillspector scan "$TARGET" --no-llm --format json --output effective-html-skillspector.json
          JSON_RC=$?
          skillspector scan "$TARGET" --no-llm --format markdown --output effective-html-skillspector.md
          MD_RC=$?
          printf 'json_exit_code=%s\nmarkdown_exit_code=%s\n' "$JSON_RC" "$MD_RC" | tee effective-html-skillspector-exit-codes.txt
          exit "$JSON_RC"

      - name: Record pinned commits
        if: always()
        run: |
          git -C effective-html rev-parse HEAD > effective-html-commit.txt
          git -C skillspector-src rev-parse HEAD > skillspector-commit.txt

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: effective-html-review
          path: |
            effective-html-skillspector.json
            effective-html-skillspector.md
            effective-html-skillspector-exit-codes.txt
            effective-html-commit.txt
            skillspector-commit.txt
          if-no-files-found: warn
          retention-days: 14
